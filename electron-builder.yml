appId: de.codemacher.dmarcviewer
productName: DMARC Viewer
executableName: dmarcviewer
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!.github/*'
asarUnpack:
  - 'resources/**'
extraResources:
  - from: build/icons
    to: icons
    filter:
      - '*.png'
  - from: build/icon.svg
    to: icons/icon.svg
afterPack: build/hooks/afterPack.cjs
icon: icon.png
win:
  executableName: dmarcviewer
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-win-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${name}-${version}-win-portable.${ext}
mac:
  icon: icon.icns
  category: public.app-category.utilities
  # Keep zip/dmg names as dmarcviewer-… (not productName "DMARC Viewer" → DMARC.Viewer-…)
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application stores encrypted mailbox settings in the user data folder.
    - NSDownloadsFolderUsageDescription: Application may access downloads if you export reports later.
  notarize: false
dmg:
  artifactName: ${name}-${version}-mac-${arch}.${ext}
linux:
  # PNG sizes for panel/_NET_WM_ICON + AppImage portals.
  # SVG alone is not used by Electron window icons; without a window bitmap Cinnamon
  # often shows a generic gear when AppImage↔desktop association fails.
  icon: icons
  executableName: dmarcviewer
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  maintainer: mail@codemacher.de
  category: Utility
  synopsis: DMARC aggregate report viewer
  description: Fetch and analyze DMARC aggregate reports from an IMAP mailbox.
  desktop:
    entry:
      Name: DMARC Viewer
      Icon: dmarcviewer
      StartupWMClass: dmarcviewer
      Terminal: false
      Type: Application
      Categories: Utility;
appImage:
  artifactName: ${name}-${version}-linux.${ext}
deb:
  artifactName: ${name}-${version}-linux.${ext}
npmRebuild: false
publish:
  provider: github
  owner: codemacherUG
  repo: dmarcviewer
