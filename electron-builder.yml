appId: de.codemacher.dmarcviewer
productName: DMARC Viewer
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!.github/*'
asarUnpack:
  - 'resources/**'
win:
  executableName: dmarcviewer
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-win-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${name}-${version}-win-portable.${ext}
mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application stores encrypted mailbox settings in the user data folder.
    - NSDownloadsFolderUsageDescription: Application may access downloads if you export reports later.
  notarize: false
dmg:
  artifactName: ${name}-${version}-mac-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  maintainer: codemacher.de
  category: Utility
  synopsis: DMARC aggregate report viewer
  description: Fetch and analyze DMARC aggregate reports from an IMAP mailbox.
appImage:
  artifactName: ${name}-${version}-linux.${ext}
deb:
  artifactName: ${name}-${version}-linux.${ext}
npmRebuild: false
publish:
  provider: github
  owner: codemacherUG
  repo: dmarcviewer
