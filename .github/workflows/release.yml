name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package ${{ matrix.platform }}
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dmarcviewer-${{ matrix.platform }}
          path: |
            release/*.*
            !release/builder-*.yml
          if-no-files-found: error

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p dist-release
          find artifacts -type f -print
          find artifacts -type f \( \
            -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o \
            -name '*.AppImage' -o -name '*.deb' -o \
            -name '*.yml' -o -name '*.blockmap' \
          \) -exec cp -v {} dist-release/ \;
          ls -lah dist-release

          pkg_ver=$(node -p "require('./package.json').version")
          echo "Validating artifact names for version $pkg_ver…"
          bad=0
          for f in dist-release/*; do
            base=$(basename "$f")
            case "$base" in
              latest.yml|latest-linux.yml|latest-mac.yml) continue ;;
            esac
            case "$base" in
              *' '*|DMARC*|*Viewer*)
                echo "Invalid name (productName leak / spaces): $base" >&2
                bad=1
                ;;
            esac
            case "$base" in
              dmarcviewer-"$pkg_ver"-*) ;;
              *)
                echo "Unexpected artifact name (want dmarcviewer-$pkg_ver-…): $base" >&2
                bad=1
                ;;
            esac
          done
          if [ "$bad" -ne 0 ]; then
            echo "Release aborted: fix electron-builder artifactName templates." >&2
            exit 1
          fi

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: DMARC Viewer ${{ steps.tag.outputs.name }}
          draft: false
          generate_release_notes: true
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
