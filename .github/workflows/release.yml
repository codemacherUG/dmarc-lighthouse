name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package ${{ matrix.platform }}
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dmarc-lighthouse-${{ matrix.platform }}
          path: |
            release/*.*
            !release/builder-*.yml
          if-no-files-found: error

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          rm -rf dist-release
          mkdir -p dist-release
          find artifacts -type f -print
          find artifacts -type f \( \
            -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o \
            -name '*.AppImage' -o -name '*.deb' -o \
            -name '*.yml' -o -name '*.blockmap' \
          \) -exec cp -v {} dist-release/ \;
          ls -lah dist-release

          pkg_ver=$(node -p "require('./package.json').version")
          echo "Validating artifact names for version $pkg_ver…"
          bad=0
          for f in dist-release/*; do
            base=$(basename "$f")
            case "$base" in
              latest.yml|latest-linux.yml|latest-mac.yml) continue ;;
              *.json|*.sig) continue ;; # signed update manifests added later
            esac
            case "$base" in
              *' '*|DMARC*|*Lighthouse*)
                echo "Invalid name (productName leak / spaces): $base" >&2
                bad=1
                ;;
            esac
            case "$base" in
              dmarc-lighthouse-"$pkg_ver"-*) ;;
              *)
                echo "Unexpected artifact name (want dmarc-lighthouse-$pkg_ver-…): $base" >&2
                bad=1
                ;;
            esac
          done
          if [ "$bad" -ne 0 ]; then
            echo "Release aborted: fix electron-builder artifactName templates." >&2
            exit 1
          fi

      - name: Sign update manifest (Ed25519)
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${UPDATE_SIGNING_PRIVATE_KEY}" ]; then
            echo "Missing secret UPDATE_SIGNING_PRIVATE_KEY — auto-update manifests cannot be signed." >&2
            exit 1
          fi
          node scripts/sign-update-manifest.mjs --dir dist-release --out dist-release
          ls -lah dist-release/*.json dist-release/*.sig

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: DMARC Lighthouse ${{ steps.tag.outputs.name }}
          draft: false
          generate_release_notes: true
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # App verifies manifests only from codemacher.de (not GitHub).
      # Optional: UPDATE_MANIFEST_DEPLOY_HOST / _USER / _KEY / _PATH (+ optional _PORT).
      - name: Deploy signed manifest to codemacher.de
        env:
          UPDATE_MANIFEST_DEPLOY_HOST: ${{ secrets.UPDATE_MANIFEST_DEPLOY_HOST }}
          UPDATE_MANIFEST_DEPLOY_USER: ${{ secrets.UPDATE_MANIFEST_DEPLOY_USER }}
          UPDATE_MANIFEST_DEPLOY_KEY: ${{ secrets.UPDATE_MANIFEST_DEPLOY_KEY }}
          UPDATE_MANIFEST_DEPLOY_PATH: ${{ secrets.UPDATE_MANIFEST_DEPLOY_PATH }}
          UPDATE_MANIFEST_DEPLOY_PORT: ${{ secrets.UPDATE_MANIFEST_DEPLOY_PORT }}
        run: |
          pkg_ver=$(node -p "require('./package.json').version")
          if [ -z "${UPDATE_MANIFEST_DEPLOY_HOST}" ] || [ -z "${UPDATE_MANIFEST_DEPLOY_USER}" ] || \
             [ -z "${UPDATE_MANIFEST_DEPLOY_KEY}" ] || [ -z "${UPDATE_MANIFEST_DEPLOY_PATH}" ]; then
            echo "Skipping auto-deploy (UPDATE_MANIFEST_DEPLOY_* secrets incomplete)."
            echo "Publish manually:"
            echo "  npm run update:deploy -- --dir dist-release --verify"
            echo "Or copy to the TYPO3 webroot, e.g. public/dmarc-lighthouse/updates/"
            echo "  dist-release/${pkg_ver}.json"
            echo "  dist-release/${pkg_ver}.json.sig"
            exit 0
          fi
          node scripts/deploy-update-manifest.mjs --dir dist-release --verify
